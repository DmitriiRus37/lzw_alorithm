[project]
name = "lzw-alorithm"
version = "0.1.0"
description = "LZW text compression"
requires-python = ">=3.14"
dependencies = ["bitarray==3.12.3"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ['if __name__ == "__main__":']
